[pytest]
# anyio's pytest plugin is for async test functions; this repo has none (FastAPI's
# TestClient and the Jieshuo harness are both synchronous). Disabling it avoids a
# warning from a mismatch between anyio's plugin and pytest's internals, with nothing
# lost, and without needing to track that combination across future version bumps.
addopts = -p no:anyio
